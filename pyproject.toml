[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algolab"
version = "0.1.0"
description = "AlgoLab — Explore. Visualize. Understand Algorithms. An educational and developer-focused, open-source Python platform for algorithm visualization, experimentation, and benchmarking."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AlgoLab Contributors" }]
keywords = ["algorithms", "sorting", "graphs", "visualization", "education", "benchmarking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bhr007/AlgoLab"
Repository = "https://github.com/bhr007/AlgoLab"
Issues = "https://github.com/bhr007/AlgoLab/issues"

[project.scripts]
algolab = "sortlab.cli:main"
sortlab = "sortlab.cli:main"

[project.optional-dependencies]
visualization = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/sortlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py39"
